- type: MultipleChoice
  question: "What is the primary characteristic of the merge sort algorithm?"
  choices:
    - "It sorts in-place by swapping adjacent elements"
    - "It divides the array into two halves, sorts them, and merges them"
    - "It selects a pivot and partitions the array around it"
    - "It repeatedly finds the minimum element and places it at the start"
  correctAnswer: "B"
  explanation: "Merge sort divides the array into two halves, recursively sorts each half, and merges the sorted halves. Option A describes bubble sort, C describes quicksort, and D describes selection sort."

- type: TrueFalse
  question: "Merge sort requires additional space proportional to the size of the input array."
  correctAnswer: "A"
  explanation: "True. Merge sort uses O(n) extra space for temporary arrays during merging, as it combines sorted halves into a new array, unlike in-place algorithms like quicksort."

- type: FillInTheBlank
  question: "The process in merge sort that combines two sorted arrays into a single sorted array is called _______."
  correctAnswer: "Merging"
  explanation: "Merging in merge sort compares elements from two sorted arrays, placing them in order into a new array, ensuring the combined result is sorted."

- type: Matching
  question: "Match the sorting algorithm with its key characteristic:"
  leftItems:
    - "Merge Sort"
    - "Quicksort"
    - "Bubble Sort"
    - "Selection Sort"
  rightItems:
    - "Swaps adjacent elements if out of order"
    - "Uses pivot to partition array"
    - "Splits array into halves and merges"
    - "Finds minimum and places it at start"
  correctMatches:
    Merge Sort: "Splits array into halves and merges"
    Quicksort: "Uses pivot to partition array"
    Bubble Sort: "Swaps adjacent elements if out of order"
    Selection Sort: "Finds minimum and places it at start"
  explanation: "Merge sort splits and merges, quicksort partitions around a pivot, bubble sort swaps neighbors, and selection sort repeatedly selects the minimum."

- type: Ordering
  question: "Arrange the steps of the merge sort algorithm for an array:"
  items:
    - "Merge the sorted halves into a single sorted array"
    - "Divide the array into two equal halves"
    - "Recursively sort each half"
    - "Compare elements from each half during merge"
    - "Check if array size is 1"
  correctOrder:
    - "Check if array size is 1"
    - "Divide the array into two equal halves"
    - "Recursively sort each half"
    - "Merge the sorted halves into a single sorted array"
    - "Compare elements from each half during merge"
  explanation: "1. If the array has 1 element, it’s sorted. 2. Divide into two halves. 3. Recursively sort each half. 4. Merge the halves into a sorted array. 5. During merge, compare elements to place them in order."

- type: MultipleSelect
  question: "Which of the following are true about merge sort? (Select all that apply)"
  choices:
    - "It has a worst-case time complexity of O(n log n)"
    - "It is an in-place sorting algorithm"
    - "It is stable, preserving relative order of equal elements"
    - "It performs best on nearly sorted arrays"
  correctAnswers: ["A", "C"]
  explanation: "Option A is true: Merge sort is O(n log n) in all cases. Option C is true: It’s stable, maintaining order of equal elements. Option B is false: Merge sort uses O(n) extra space. Option D is false: Merge sort’s performance is consistent, unlike insertion sort."

- type: MultipleChoice
  question: "Consider an array with values 4, 2, 6, 1. After merge sort splits it into two halves and sorts them, what are the sorted halves?"
  choices:
    - "[4, 2] and [6, 1]"
    - "[2, 4] and [1, 6]"
    - "[4, 6] and [1, 2]"
    - "[2, 6] and [1, 4]"
  correctAnswer: "B"
  explanation: "Merge sort splits [4, 2, 6, 1] into [4, 2] and [6, 1]. Sorting each half gives [2, 4] (from 4, 2) and [1, 6] (from 6, 1), as each half is recursively sorted."

- type: TrueFalse
  question: "The merging step in merge sort compares elements from two halves in a single pass."
  correctAnswer: "A"
  explanation: "True. Merging compares elements from two sorted halves, taking the smaller one each time and placing it in the output array, completing the merge in one pass through both halves."

- type: MultipleChoice
  question: "What is the final sorted array after applying merge sort to [8, 3, 4, 12]?"
  choices:
    - "[3, 4, 8, 12]"
    - "[8, 3, 4, 12]"
    - "[12, 8, 4, 3]"
    - "[4, 3, 8, 12]"
  correctAnswer: "A"
  explanation: "Merge sort splits [8, 3, 4, 12] into [8, 3] and [4, 12], sorts them to [3, 8] and [4, 12], and merges to [3, 4, 8, 12], ensuring ascending order."

- type: MultipleSelect
  question: "Which of the following sorting algorithms have a worst-case time complexity of O(n^2)? (Select all that apply)"
  choices:
    - "Merge Sort"
    - "Bubble Sort"
    - "Insertion Sort"
    - "Quicksort"
  correctAnswers: ["B", "C", "D"]
  explanation: "Option B is true: Bubble sort is O(n^2) due to nested loops. Option C is true: Insertion sort is O(n^2) in the worst case. Option D is true: Quicksort is O(n^2) with poor pivot choices. Option A is false: Merge sort is O(n log n)."

- type: FillInTheBlank
  question: "In merge sort, the array is recursively divided until each subarray has _______ element(s)."
  correctAnswer: "One"
  explanation: "Merge sort divides the array into halves until each subarray contains one element, which is inherently sorted, before merging them back into larger sorted arrays."

- type: MultipleChoice
  question: "During the merge step for arrays [1, 3, 5] and [2, 4, 6], what is the first element placed in the merged array?"
  choices:
    - "1"
    - "2"
    - "3"
    - "4"
  correctAnswer: "A"
  explanation: "Merging compares the first elements of [1, 3, 5] and [2, 4, 6]. Since 1 is less than 2, 1 is placed first in the merged array."

- type: Matching
  question: "Match the sorting algorithm with its space complexity:"
  leftItems:
    - "Merge Sort"
    - "Quicksort"
    - "Bubble Sort"
  rightItems:
    - "O(1)"
    - "O(n)"
    - "O(log n)"
  correctMatches:
    Merge Sort: "O(n)"
    Quicksort: "O(log n)"
    Bubble Sort: "O(1)"
  explanation: "Merge sort uses O(n) extra space for merging. Quicksort uses O(log n) for the call stack in the average case. Bubble sort is in-place, needing O(1) extra space."

- type: TrueFalse
  question: "Merge sort is less efficient than bubble sort for small arrays due to its overhead."
  correctAnswer: "A"
  explanation: "True. Merge sort’s recursive calls and extra space make it less efficient for very small arrays (e.g., n < 10), where bubble sort’s simplicity can be faster despite O(n^2) complexity."

- type: Ordering
  question: "Arrange the steps to merge two sorted arrays in merge sort:"
  items:
    - "Compare first elements of both arrays"
    - "Place smaller element in output array"
    - "Move to next element in the chosen array"
    - "Copy remaining elements from either array"
    - "Repeat until one array is empty"
  correctOrder:
    - "Compare first elements of both arrays"
    - "Place smaller element in output array"
    - "Move to next element in the chosen array"
    - "Repeat until one array is empty"
    - "Copy remaining elements from either array"
  explanation: "1. Compare the first elements of both arrays. 2. Place the smaller in the output. 3. Advance the pointer in the array chosen. 4. Repeat until one array is empty. 5. Copy any remaining elements from the non-empty array."
  