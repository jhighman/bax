- type: MultipleChoice
  question: "You need to store a mapping of employee IDs to their department names, expecting a high number of collisions due to a poor hash function. Which collection should you use to ensure efficient lookups?"
  choices:
    - "TreeMap"
    - "HashMap"
    - "LinkedHashMap"
    - "ArrayDeque"
  correctAnswer: "B"
  explanation: "HashMap handles collisions by storing entries in a bucket as a linked list, converting to a balanced tree if the bucket size exceeds 8, ensuring efficient lookups even with a poor hash function."

- type: MultipleSelect
  question: "You need to store a collection of unique event IDs for a calendar app, where the order of events doesn’t matter. Which collections are suitable? (Select all that apply)"
  choices:
    - "HashSet"
    - "TreeSet"
    - "LinkedList"
    - "LinkedHashSet"
  correctAnswers: ["A"]
  explanation: "HashSet ensures uniqueness with no order, making it suitable for event IDs where order doesn’t matter. TreeSet sorts elements, LinkedHashSet maintains insertion order, and LinkedList allows duplicates."

- type: Matching
  question: "Match the scenario with the most appropriate collection:"
  leftItems:
    - "Store unique project codes with no order"
    - "Store key-value pairs of user IDs and roles, sorted by ID"
    - "Store a list of comments, allowing duplicates"
    - "Store notifications to be processed by urgency"
  rightItems:
    - "HashSet"
    - "TreeMap"
    - "ArrayList"
    - "PriorityQueue"
  correctMatches:
    "Store unique project codes with no order": "HashSet"
    "Store key-value pairs of user IDs and roles, sorted by ID": "TreeMap"
    "Store a list of comments, allowing duplicates": "ArrayList"
    "Store notifications to be processed by urgency": "PriorityQueue"
  explanation: "HashSet ensures uniqueness with no order. TreeMap sorts keys (user IDs). ArrayList allows duplicates for comments. PriorityQueue orders notifications by urgency."

- type: MultipleChoice
  question: "You need to store a collection of pending requests that can be efficiently added to the front and removed from the back. Which collection should you use?"
  choices:
    - "ArrayList"
    - "ArrayDeque"
    - "TreeSet"
    - "LinkedHashMap"
  correctAnswer: "B"
  explanation: "ArrayDeque, a Deque implementation, supports efficient additions at the front and removals at the back, making it ideal for this scenario."

- type: TrueFalse
  question: "If you need to store key-value pairs with keys sorted by a custom Comparator, HashMap is the best choice."
  correctAnswer: "B"
  explanation: "HashMap doesn’t sort keys. TreeMap, which supports a custom Comparator for sorting keys, is the better choice for this scenario."

- type: Ordering
  question: "Order the following collections from least to most suitable for storing key-value pairs where keys need to be sorted by a custom Comparator:"
  items:
    - "HashMap"
    - "LinkedHashMap"
    - "TreeMap"
    - "ArrayList"
  correctOrder:
    - "ArrayList"
    - "HashMap"
    - "LinkedHashMap"
    - "TreeMap"
  explanation: "ArrayList isn’t a key-value store. HashMap doesn’t sort keys. LinkedHashMap maintains insertion order but doesn’t sort. TreeMap sorts keys using a custom Comparator, making it the most suitable."

- type: MultipleChoice
  question: "You need to store a thread-safe collection of user sessions with session IDs as keys. Which collection should you use?"
  choices:
    - "HashMap"
    - "ConcurrentHashMap"
    - "TreeMap"
    - "LinkedList"
  correctAnswer: "B"
  explanation: "ConcurrentHashMap is thread-safe and designed for concurrent access, making it ideal for storing user sessions in a multi-threaded environment."

- type: FillInTheBlank
  question: "To store a collection of unique department names in alphabetical order, you should use the _______ collection."
  correctAnswer: "TreeSet"
  explanation: "TreeSet ensures uniqueness and maintains elements in sorted order (alphabetically, using natural ordering or a Comparator), making it ideal for department names."

- type: MultipleSelect
  question: "You need to store key-value pairs of order IDs and amounts, maintaining the order of insertion for auditing purposes. Which collections are suitable? (Select all that apply)"
  choices:
    - "HashMap"
    - "TreeMap"
    - "LinkedHashMap"
    - "ConcurrentHashMap"
  correctAnswers: ["C"]
  explanation: "LinkedHashMap maintains insertion order, making it suitable for auditing. HashMap doesn’t guarantee order, TreeMap sorts by keys, and ConcurrentHashMap focuses on thread safety."

- type: MultipleChoice
  question: "You need to store a collection of tasks to be processed in a LIFO (Last-In-First-Out) manner. Which collection should you use?"
  choices:
    - "ArrayDeque"
    - "Stack"
    - "PriorityQueue"
    - "HashSet"
  correctAnswer: "B"
  explanation: "Stack is designed for LIFO operations, making it ideal for processing tasks in a last-in-first-out manner. ArrayDeque can also work but isn’t the classic choice."

- type: TrueFalse
  question: "If you need to store unique elements with no duplicates and maintain insertion order, TreeSet is the best choice."
  correctAnswer: "B"
  explanation: "TreeSet ensures uniqueness but sorts elements, ignoring insertion order. LinkedHashSet is the better choice for maintaining insertion order while ensuring uniqueness."

