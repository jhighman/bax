- type: MultipleSelect
  question: "You need to store a collection of commands that can be processed in a FIFO (First-In-First-Out) manner. Which collections are suitable? (Select all that apply)"
  choices:
    - "Stack"
    - "ArrayDeque"
    - "PriorityQueue"
    - "LinkedList"
  correctAnswers: ["B", "D"]
  explanation: "ArrayDeque and LinkedList can both function as queues (FIFO) by adding elements at the end and removing from the front. Stack is LIFO, and PriorityQueue orders by priority."

- type: MultipleChoice
  question: "You need to store a list of items that will be frequently accessed by index in a thread-safe manner. Which collection should you use?"
  choices:
    - "ArrayList"
    - "Vector"
    - "HashSet"
    - "TreeMap"
  correctAnswer: "B"
  explanation: "Vector provides fast random access by index (O(1)) and is thread-safe, making it suitable for this scenario. ArrayList is not thread-safe."

